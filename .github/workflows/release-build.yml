name: Build Release Bundles

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Optional version to publish as a tag/release (for example 0.1.0 or v0.1.0). Leave empty to only build artifacts.
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && inputs.version != ''
      && format('Build and release {0}', inputs.version)
      || github.event_name == 'workflow_dispatch'
      && 'Build artifacts (manual)'
      || format('Build release bundles for {0}', github.ref_name)
  }}

jobs:
  prepare-web:
    name: Prepare frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve app version
        id: app_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="$(python3 -c "import json; print(json.load(open('package.json', 'r', encoding='utf-8'))['version'])")"
          fi

          RAW_VERSION="${RAW_VERSION//[[:space:]]/}"
          APP_VERSION="${RAW_VERSION#v}"

          if [[ -z "${APP_VERSION}" ]]; then
            echo "Failed to resolve app version." >&2
            exit 1
          fi

          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release source
        run: pnpm ci:basic-check

      - name: Sync app version
        run: node scripts/set-app-version.mjs --version "${{ steps.app_version.outputs.version }}"

      - name: Build renderer bundle
        run: pnpm test:upgrade && pnpm test:renderer && pnpm modeltrace:check && pnpm catalog:check && pnpm build:tauri:web

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-assets
          path: out
          if-no-files-found: error
          compression-level: 0

  build-tauri:
    name: Build ${{ matrix.label }}
    needs: [prepare-web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            prepare_cmd: node scripts/prepare-tauri-bundled-binary.mjs --target aarch64-apple-darwin
            build_cmd: pnpm dlx @tauri-apps/cli@2.10.1 build --ci --config src-tauri/tauri.conf.json --bundles dmg --target aarch64-apple-darwin
            postprocess_cmd: bash scripts/postprocess-macos-dmg.sh src-tauri/target/aarch64-apple-darwin/release/bundle/dmg lich13studio
            artifact_name: macos-dmg-arm64
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            prepare_cmd: node scripts/prepare-tauri-bundled-binary.mjs --target x86_64-pc-windows-msvc
            build_cmd: pnpm dlx @tauri-apps/cli@2.10.1 build --ci --config src-tauri/tauri.conf.json --bundles nsis --target x86_64-pc-windows-msvc
            postprocess_cmd: ''
            artifact_name: windows-exe-x64
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve app version
        id: app_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="$(python3 -c "import json; print(json.load(open('package.json', 'r', encoding='utf-8'))['version'])")"
          fi

          RAW_VERSION="${RAW_VERSION//[[:space:]]/}"
          APP_VERSION="${RAW_VERSION#v}"

          if [[ -z "${APP_VERSION}" ]]; then
            echo "Failed to resolve app version." >&2
            exit 1
          fi

          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Sync app version
        run: node scripts/set-app-version.mjs --version "${{ steps.app_version.outputs.version }}"

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-assets
          path: out

      - name: Prepare bundled binary
        run: ${{ matrix.prepare_cmd }}

      - name: Test native commands
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=2
          attempt=1

          while true; do
            echo "macOS bundle attempt ${attempt}/${max_attempts}"

            if eval "${{ matrix.build_cmd }}"; then
              break
            fi

            if [[ "${attempt}" -ge "${max_attempts}" ]]; then
              echo "macOS bundle failed after ${attempt} attempts" >&2
              exit 1
            fi

            echo "Cleaning bundle output before retry..."
            node scripts/clean-paths.mjs "src-tauri/target/${{ matrix.rust_target }}/release/bundle"
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Build Tauri bundle
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: ${{ matrix.build_cmd }}

      - name: Postprocess macOS DMG
        if: ${{ matrix.postprocess_cmd != '' }}
        run: ${{ matrix.postprocess_cmd }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0

  build-android:
    name: Build Android ARM64
    needs: [prepare-web]
    runs-on: ubuntu-latest
    env:
      LICH13_ANDROID_SIGNING_PROPERTIES: /tmp/lich13studio-android-release.properties
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-assets
          path: out
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install tauri-cli --version 2.10.1 --locked
      - name: Load independent Android release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.LICH13_ANDROID_KEYSTORE }}
          ANDROID_SIGNING: ${{ secrets.LICH13_ANDROID_SIGNING }}
        run: |
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          for name, data in [('/tmp/lich13studio-android-release.p12', base64.b64decode(os.environ['ANDROID_KEYSTORE'], validate=True)), (os.environ['LICH13_ANDROID_SIGNING_PROPERTIES'], os.environ['ANDROID_SIGNING'].encode())]:
              if not data: raise SystemExit('Android signing secret is missing')
              path = Path(name)
              path.write_bytes(data)
              path.chmod(0o600)
          PYKEY
      - name: Build signed Android package
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then node scripts/set-app-version.mjs --version "${GITHUB_REF_NAME#v}"; elif [[ -n "$RELEASE_INPUT" ]]; then node scripts/set-app-version.mjs --version "${RELEASE_INPUT#v}"; fi
          cargo tauri android build --target aarch64 --apk --ci
          python3 scripts/verify-android.py src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mkdir -p android-release
          VERSION=$(node -p 'require("./package.json").version')
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "android-release/lich13studio_${VERSION}_android_arm64-v8a.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-arm64
          path: android-release/*.apk
          if-no-files-found: error
          compression-level: 0
      - name: Remove runner signing material
        if: always()
        run: python3 -c "from pathlib import Path; [Path(p).unlink(missing_ok=True) for p in ['/tmp/lich13studio-android-release.p12', '/tmp/lich13studio-android-release.properties']]"

  publish-release:
    name: Publish GitHub Release
    needs: [build-tauri, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Normalize release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
            RAW_VERSION="${RAW_VERSION//[[:space:]]/}"
            if [[ -z "${RAW_VERSION}" ]]; then
              echo "Manual release requires a version input." >&2
              exit 1
            fi
            if [[ "${RAW_VERSION}" == v* ]]; then
              TAG_NAME="${RAW_VERSION}"
            else
              TAG_NAME="v${RAW_VERSION}"
            fi
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \) | sort)

          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          python3 - <<'PYHASH'
          import hashlib
          from pathlib import Path
          root = Path('release-assets')
          files = sorted(p for p in root.iterdir() if p.suffix in {'.exe', '.dmg', '.apk'})
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PYHASH
          release_files+=(release-assets/SHA256SUMS)
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          NOTES_FILE="docs/releases/${TAG_NAME}.zh-CN.md"
          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "Chinese release notes are required for ${TAG_NAME}." >&2
            exit 1
          fi

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${release_files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG_NAME}" --notes-file "${NOTES_FILE}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create \
              "${TAG_NAME}" \
              "${release_files[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --notes-file "${NOTES_FILE}"
          fi
