name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer bundle
        run: pnpm ci:basic-check && pnpm test:upgrade && pnpm test:renderer && pnpm modeltrace:check && pnpm catalog:check && pnpm build:tauri:web

      - uses: actions/upload-artifact@v7
        with:
          name: ci-frontend
          path: out
          retention-days: 1

  android:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    env:
      LICH13_ANDROID_TEST_ABI: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/download-artifact@v8
        with:
          name: ci-frontend
          path: out
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          cargo install tauri-cli --version 2.10.1 --locked
      - name: Build Android and isolated device tests
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo tauri android build --debug --target x86_64 --apk --ci
          cd src-tauri/gen/android
          ./gradlew :app:assembleUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API ${{ matrix.api }} device regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            adb install -r src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
            adb shell am instrument -w -e class com.lich13.studio.MobileSmokeTest#importsUseConfirmationAndPrivateCredentials com.lich13.studio.test/androidx.test.runner.AndroidJUnitRunner > android-device-test.log
            cat android-device-test.log
            grep -q 'OK (1 test)' android-device-test.log
            adb shell am instrument -w -e class com.lich13.studio.MobileSmokeTest#nativeModelAndProviderSelectorsRemainStable com.lich13.studio.test/androidx.test.runner.AndroidJUnitRunner > android-selector-test.log
            cat android-selector-test.log
            grep -q 'OK (1 test)' android-selector-test.log
            adb shell am instrument -w -e class com.lich13.studio.MobileSmokeTest#modelTraceEarlyFinishStopsAtOneResponseAndReleasesAndroidTask com.lich13.studio.test/androidx.test.runner.AndroidJUnitRunner > android-modeltrace-test.log
            cat android-modeltrace-test.log
            grep -q 'OK (1 test)' android-modeltrace-test.log
            adb shell am force-stop com.lich13.studio
            adb shell am instrument -w -e class com.lich13.studio.MobileSmokeTest#credentialsSurviveProcessRestart com.lich13.studio.test/androidx.test.runner.AndroidJUnitRunner > android-restart-test.log
            cat android-restart-test.log
            grep -q 'OK (1 test)' android-restart-test.log
